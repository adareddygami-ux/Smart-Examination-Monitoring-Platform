{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-8 text-center">
        <h1 class="display-4">Online Exam Integrity Monitoring System</h1>
        <p class="lead mt-3">A secure, automated platform for managing online examinations and ensuring academic integrity.</p>
        <hr class="my-4">
        <p>Please register or log in to continue.</p>
        <div class="mt-4">
            <a href="{{ url_for('auth.login') }}" class="btn btn-primary btn-lg me-2">Login</a>
            <a href="{{ url_for('auth.register') }}" class="btn btn-outline-secondary btn-lg">Register</a>
        </div>
    </div>
</div>
{% endblock %}
